[project]
name = "yousecure-scan"
version = "0.1.0"
description = "Fast, pattern-based security scanner for your codebase, with an optional Claude-powered review pass."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]

[project.scripts]
yousecure-scan = "yousecure_scan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yousecure_scan*"]
